services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: tracelens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens -d tracelens"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  trace_data:
